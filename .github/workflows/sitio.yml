name: Sitio público

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r 06_Sitio_Publico/requirements.txt
      - run: python 06_Sitio_Publico/ensamblar_docs.py
      - run: mkdocs build -f 06_Sitio_Publico/mkdocs.yml
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
        with:
          path: 06_Sitio_Publico/site

  deploy:
    # Se activa con la variable de repositorio PAGES_ENABLED=true una vez habilitado Pages (PENDIENTES.md, A4–A5)
    if: github.event_name != 'pull_request' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
