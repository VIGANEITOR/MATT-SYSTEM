name: Contratos y registro de estado

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r 02_Agentes/requirements.txt
      - run: python 02_Agentes/validar_contratos.py
      - run: python 02_Agentes/pruebas_contratos.py
      - run: python 00_Especificacion/registro/generar.py --check
